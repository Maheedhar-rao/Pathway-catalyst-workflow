<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🐊 CROC | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(to right, #2c3e50, #4ca1af);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .container {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 28px;
      color: #2c3e50;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 15px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #4ca1af;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #357a8a;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: #e74c3c;
    }

    .forgot-link {
      margin-top: 12px;
      font-size: 14px;
      color: #2c3e50;
      text-decoration: underline;
      cursor: pointer;
      display: block;
    }

    /* 🔳 Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 20px;
      font-size: 24px;
      cursor: pointer;
    }

    .success {
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🐊 Login to Your CRM</h2>
    <form id="login-form">
      <input type="email" id="email" required placeholder="Enter your email" />
      <input type="password" id="password" required placeholder="Enter your password" />
      <button type="submit">Login</button>
    </form>

    <span class="forgot-link" onclick="openModal()">Forgot Password?</span>
    <p id="message"></p>
  </div>

  <!-- 🔳 Modal HTML -->
  <div class="modal" id="resetModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">×</span>
      <h3>Reset Password</h3>
      <input type="email" id="reset-email" placeholder="Enter your email" />
      <button onclick="resetPassword()">Send New Password</button>
      <p id="reset-message"></p>
    </div>
  </div>

  <script>
    // Login logic
    document.getElementById("login-form").onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          document.getElementById("message").textContent = data.error || "Login failed.";
          return;
        }

        localStorage.setItem("id_token", data.token);
        window.location.href = "/dashboard.html";
      } catch (err) {
        document.getElementById("message").textContent = "🚨 Unexpected server error.";
      }
    };

    // Modal functions
    function openModal() {
      document.getElementById("resetModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("resetModal").style.display = "none";
      document.getElementById("reset-message").textContent = "";
    }

    // Password reset logic
    async function resetPassword() {
      const email = document.getElementById("reset-email").value;
      const msg = document.getElementById("reset-message");
      msg.textContent = "";

      if (!email) {
        msg.textContent = "Please enter your email.";
        return;
      }

      try {
        const res = await fetch("/api/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const text = await res.text();

        if (res.ok) {
          msg.textContent = text;
          msg.className = "success";

          // Auto-redirect to login after 2 seconds
          setTimeout(() => {
            closeModal();
            alert("Password reset successful. Check your email.");
          }, 2000);
        } else {
          msg.textContent = text;
        }
      } catch (err) {
        msg.textContent = "Something went wrong. Try again.";
      }
    }
  </script>
</body>
</html>
