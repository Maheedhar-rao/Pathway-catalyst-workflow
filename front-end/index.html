<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Submission Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
        }
        .buttons {
            margin-bottom: 20px;
        }
        .buttons button {
            margin: 5px;
        }
        #selectedData {
            margin-top: 10px;
        }
        .pdf-list {
            margin-top: 15px;
        }
        .pdf-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .pdf-item a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Business Submission Form</h2>

    <form id="businessForm">
        <!-- Business Name -->
        <label for="businessName">Business Name:</label>
        <input type="text" id="businessName" name="businessName" required><br><br>

        <!-- Lender Name -->
        <label for="lenderName">Lender Name:</label>
        <input type="text" id="lenderName" name="lenderName" required><br><br>

        <!-- Deal ID -->
        <label for="dealId">Deal ID:</label>
        <input type="text" id="dealId" name="dealId" required><br><br>

        <!-- Buttons for Selection -->
        <div class="buttons">
            <label>Select a button to input data:</label><br>
            <button type="button" onclick="selectButton(1)">Button 1</button>
            <button type="button" onclick="selectButton(2)">Button 2</button>
            <button type="button" onclick="selectButton(3)">Button 3</button>
        </div>

        <!-- Input for Data -->
        <label for="inputData">Enter Data for Selected Button:</label><br>
        <input type="text" id="inputData" name="inputData"><br><br>

        <!-- Field to See Data -->
        <label for="selectedData">Selected Button Data:</label><br>
        <textarea id="selectedData" rows="5" cols="50" readonly></textarea><br><br>

        <!-- PDF Upload Section -->
        <label for="pdfUpload">Upload PDF Files:</label><br>
        <input type="file" id="pdfUpload" accept="application/pdf"><br><br>

        <!-- List of Uploaded PDFs -->
        <div class="pdf-list" id="pdfList"></div>

        <!-- Submit Button -->
        <button type="submit">Submit</button>
    </form>
</div>

<script>
    let selectedButton = null;
    const buttonData = {};
    const pdfFiles = [];

    function selectButton(buttonNumber) {
        selectedButton = buttonNumber;
        document.getElementById("selectedData").value = buttonData[buttonNumber] || '';
        alert(`Button ${buttonNumber} selected`);
    }

    document.getElementById('inputData').addEventListener('input', function (event) {
        if (selectedButton !== null) {
            buttonData[selectedButton] = event.target.value;
            document.getElementById("selectedData").value = event.target.value;
        } else {
            alert('Please select a button first!');
        }
    });

    document.getElementById("pdfUpload").addEventListener('change', function (event) {
        const file = event.target.files[0];
        if (file && file.type === "application/pdf") {
            const reader = new FileReader();
            reader.onload = function (e) {
                const fileURL = e.target.result;
                pdfFiles.push({ name: file.name, url: fileURL });
                displayPDFs();
            };
            reader.readAsDataURL(file);
        } else {
            alert("Please upload a valid PDF file.");
        }
    });

    function displayPDFs() {
        const pdfListDiv = document.getElementById("pdfList");
        pdfListDiv.innerHTML = "<h3>Uploaded PDFs:</h3>";

        pdfFiles.forEach((pdf, index) => {
            const pdfItem = document.createElement("div");
            pdfItem.classList.add("pdf-item");
            pdfItem.innerHTML = `
                <a href="${pdf.url}" target="_blank">${pdf.name}</a>
                <button onclick="removePDF(${index})">Remove</button>
            `;
            pdfListDiv.appendChild(pdfItem);
        });
    }

    function removePDF(index) {
        pdfFiles.splice(index, 1);
        displayPDFs();
    }

    document.getElementById("businessForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const businessName = document.getElementById("businessName").value;
        const lenderName = document.getElementById("lenderName").value;
        const dealid = document.getElementById("dealId").value;

        // Collect PDF links
        const pdfElements = document.querySelectorAll(".pdf-item a");
        const docs = Array.from(pdfElements).map((pdf) => pdf.href);

        const response = await fetch("https://pathway-catalyst-workflow.onrender.com", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ businessName, lenderName, dealid, buttonData, docs }),
        });

        const result = await response.json();
        alert(result.message);
    });
</script>

</body>
</html>
